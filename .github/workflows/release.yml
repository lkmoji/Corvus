name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and Zip extension
        run: |
          # Ищем папку extension где угодно внутри репозитория
          EXT_DIR=$(find . -type d -name "extension" -not -path "*/\.*" | head -n 1)
          if [ -z "$EXT_DIR" ]; then
            echo "ОШИБКА: Папка extension не найдена!"
            exit 1
          fi
          echo "Найдена папка: $EXT_DIR"
          cd "$EXT_DIR"
          zip -r ../../extension.zip . -x '*.git*'

      - name: Find and Zip bridge
        run: |
          # Ищем папку bridge где угодно внутри репозитория
          BRG_DIR=$(find . -type d -name "bridge" -not -path "*/\.*" | head -n 1)
          if [ -z "$BRG_DIR" ]; then
            echo "ОШИБКА: Папка bridge не найдена!"
            exit 1
          fi
          echo "Найдена папка: $BRG_DIR"
          cd "$BRG_DIR"
          zip -r ../../bridge.zip . -x '*.git*'

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension.zip
            bridge.zip
